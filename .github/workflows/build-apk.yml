# Builds a debug Android APK in the cloud (no NDK compilation on the phone).
# Download the artifact named "NewsSphere-debug-apk" from the run summary.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK=""
          for base in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            [ -n "$base" ] && [ -d "$base" ] || continue
            SM=$(find "$base" -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -n "$SM" ]; then
              SDK="$base"
              echo "$(dirname "$SM")" >> "$GITHUB_PATH"
            fi
            [ -n "$SDK" ] && break
          done
          if [ -z "$SDK" ]; then echo "Android SDK not found"; exit 1; fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Android NDK + packages
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platform-tools" "platforms;android-34"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Generate app icons
        run: npx tauri icon src-tauri/icon-source.png

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build debug APK
        run: npx tauri android build --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsSphere-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
