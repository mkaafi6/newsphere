# Builds a debug Android APK in the cloud (no NDK compilation on the phone).
# Download the artifact named "NewsSphere-debug-apk" from the run summary.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android cmdline-tools
        run: |
          CMDLINE=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -printf '%h\n' | head -1)
          echo "cmdline-tools: $CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"

      - name: Install Android NDK + packages
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platform-tools" "platforms;android-34"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Generate app icons
        run: npx tauri icon src-tauri/icon-source.png

      - name: Initialize Android project
        run: npx tauri android init

      - name: Build debug APK
        run: npx tauri android build --apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsSphere-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
